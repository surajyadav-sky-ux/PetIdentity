{% extends "base.html" %}
{% block title %}Register - PetIdentity{% endblock %}
{% block content %}
<div class="pi-auth-wrapper">
  <div class="row justify-content-center w-100">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="pi-auth-icon">🐾</div>
          <h3 class="mb-3 text-center">Create Your PetIdentity Account</h3>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required minlength="6">
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm Password</label>
              <input type="password" name="confirm_password" class="form-control" required minlength="6">
            </div>
            <div class="mb-3">
              <label class="form-label">Security Question: {{ security_question }}</label>
              <input type="text" name="security_answer" class="form-control" placeholder="Your answer" required>
              <div class="form-text">Used to reset your password if you forget it.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>
          <p class="mt-3 mb-0 text-center">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
