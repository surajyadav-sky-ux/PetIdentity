{% extends "base.html" %}
{% block title %}Edit {{ pet['pet_name'] }} - PetQR{% endblock %}
{% block content %}
<h3 class="mb-3">Edit {{ pet['pet_name'] }}</h3>
<form method="POST" enctype="multipart/form-data" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Pet Name *</label>
    <input type="text" name="pet_name" class="form-control" value="{{ pet['pet_name'] }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Pet Type</label>
    <input type="text" name="pet_type" class="form-control" value="{{ pet['pet_type'] or '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Breed</label>
    <input type="text" name="breed" class="form-control" value="{{ pet['breed'] or '' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Age</label>
    <input type="text" name="age" class="form-control" value="{{ pet['age'] or '' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Gender</label>
    <select name="gender" class="form-select">
      <option value="" {% if not pet['gender'] %}selected{% endif %}>Select</option>
      <option value="Male" {% if pet['gender']=='Male' %}selected{% endif %}>Male</option>
      <option value="Female" {% if pet['gender']=='Female' %}selected{% endif %}>Female</option>
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Color</label>
    <input type="text" name="color" class="form-control" value="{{ pet['color'] or '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Photo {% if pet['photo'] %}(current photo will be kept unless replaced){% endif %}</label>
    <input type="file" name="photo" class="form-control" accept="image/*">
    {% if pet['photo'] %}
      <img src="{{ url_for('static', filename='uploads/' + pet['photo']) }}" class="mt-2" style="height:80px;">
    {% endif %}
  </div>
  <hr class="mt-4">
  <h5>Owner / Contact Info</h5>
  <div class="col-md-6">
    <label class="form-label">Owner Name</label>
    <input type="text" name="owner_name" class="form-control" value="{{ pet['owner_name'] or '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Phone</label>
    <input type="text" name="phone" class="form-control" value="{{ pet['phone'] or '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" value="{{ pet['email'] or '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Address</label>
    <input type="text" name="address" class="form-control" value="{{ pet['address'] or '' }}">
  </div>
  <div class="col-12">
    <div class="form-check">
      <input type="checkbox" name="show_address" value="1" class="form-check-input" id="showAddress"
        {% if pet['show_address'] %}checked{% endif %}>
      <label class="form-check-label" for="showAddress">
        Show this address on the public pet profile (anyone who scans the QR code will see it)
      </label>
    </div>
  </div>
  <div class="col-12">
    <label class="form-label">Additional Info</label>
    <textarea name="additional_info" class="form-control" rows="3">{{ pet['additional_info'] or '' }}</textarea>
  </div>

  {% if pet['qr_code'] %}
  <div class="col-12">
    <label class="form-label d-block">QR Code</label>
    <img src="{{ url_for('static', filename='qrcodes/' + pet['qr_code']) }}" style="width:150px;height:150px;">
    <div class="mt-2">
      <a href="{{ url_for('download_qr', pet_id=pet['id']) }}" class="btn btn-sm btn-outline-success">Download QR</a>
      <a href="{{ url_for('pet_public', unique_id=pet['unique_id']) }}" target="_blank" class="btn btn-sm btn-outline-secondary">View Public Profile</a>
    </div>
  </div>
  {% endif %}

  <div class="col-12 mt-3">
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
