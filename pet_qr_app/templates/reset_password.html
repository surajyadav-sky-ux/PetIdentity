{% extends "base.html" %}
{% block title %}Reset Password - PetIdentity{% endblock %}
{% block content %}
<div class="pi-auth-wrapper">
  <div class="row justify-content-center w-100">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="pi-auth-icon">🔐</div>
          <h3 class="mb-3 text-center">Set a New Password</h3>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" name="password" class="form-control" required minlength="6" autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <input type="password" name="confirm_password" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
