{% extends "base.html" %}
{% block title %}Forgot Password - PetIdentity{% endblock %}
{% block content %}
<div class="pi-auth-wrapper">
  <div class="row justify-content-center w-100">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="pi-auth-icon">🔑</div>
          <h3 class="mb-2 text-center">Forgot Password</h3>
          <p class="text-muted text-center small mb-3">Enter your account email to continue.</p>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Continue</button>
          </form>
          <p class="mt-3 mb-0 text-center"><a href="{{ url_for('login') }}">&laquo; Back to login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
